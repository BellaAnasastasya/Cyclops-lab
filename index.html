const DATA=window.CYCLOPS_DATA;
const byId=s=>document.getElementById(s);
const H=new Map(DATA.heroes.map(h=>[h.name,h]));
const I=DATA.items;
const selected={enemy:[],ally:[]};
const iconsReady=new Map();
const trait=(h,k)=>h?.traits?.[k]||0;
const sum=(team,k)=>team.reduce((v,n)=>v+trait(H.get(n),k),0);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const heroSlug=s=>s.toLowerCase().replace(/[.'’]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const heroUrls=name=>{
 const special={"Chang'e":"chang27e","Lapu-Lapu":"lapu-lapu","Yi Sun-shin":"yi_sun-shin"};
 const filename=special[name]||heroSlug(name).replaceAll('-','_');
 return [`https://raw.githubusercontent.com/Ceplin03/database-mlbb.Mobile-Legends-Bang-Bang/master/images-hero/${filename}.png`,
 `https://mlbbhub.com/images/heroes/${heroSlug(name)}.png`];
};
function face(urls,name,small=false){
 const first=iconsReady.get(name)||urls[0];
 const others=[first,...urls.filter(u=>u!==first)];
 return `<span class="face ${small?'sm':''}"><img alt="${esc(name)}" src="${esc(others[0])}" data-next="1" data-urls="${esc(encodeURIComponent(JSON.stringify(others)))}" loading="lazy" referrerpolicy="no-referrer" onerror="retryImage(this)"/><span class="letters">${esc(name.slice(0,2).toUpperCase())}</span></span>`;
}
window.retryImage=img=>{
 try{
  const urls=JSON.parse(decodeURIComponent(img.getAttribute('data-urls')));
  const idx=Number(img.getAttribute('data-next'));
  if(idx<urls.length){img.setAttribute('data-next',String(idx+1));img.src=urls[idx];}
  else{img.onerror=null;img.remove();}
 }catch(e){img.onerror=null;img.remove();}
};
function metaRank(h){return h.tier==='S'?0:(h.tier==='A'?1:(h.proMeta?2:3));}
function renderTeam(t){
 const names=selected[t],limit=t==='enemy'?5:4;
 byId(t+'Count').textContent=`${names.length}/${limit}`;
 byId(t+'Slots').innerHTML=Array.from({length:limit},(_,i)=>{
  const n=names[i];return n?`<button type="button" class="slot chosen" data-remove="${i}" title="Hapus ${esc(n)}">${face(heroUrls(n),n)}<span>${esc(n)}</span><b class="x">×</b></button>`:'<span class="slot blank">+</span>';
 }).join('');
 byId(t+'Slots').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{
  selected[t].splice(Number(b.dataset.remove),1);renderTeam('enemy');renderTeam('ally');autoBuild();
 });
 const full=names.length>=limit;
 byId(t+'Search').style.display=full?'none':'';
 byId(t+'Matches').style.display=full?'none':'';

 const allow=DATA.heroes.filter(h=>h.name!=='Cyclops'&&!selected.enemy.includes(h.name)&&!selected.ally.includes(h.name));
 const matches=q?allow.filter(h=>h.name.toLowerCase().includes(q)).sort((a,b)=>metaRank(a)-metaRank(b)||a.name.localeCompare(b.name)).slice(0,12):[];
 const area=byId(t+'Matches');
 area.innerHTML=matches.map(h=>`<button type="button" class="suggest" data-name="${esc(h.name)}">${face(heroUrls(h.name),h.name,true)}<span>${esc(h.name)}</span>${h.tier==='S'||h.tier==='A'?`<i class="tier">${h.tier}</i>`:(h.proMeta?'<i class="tier">PRO</i>':'')}</button>`).join('');
 area.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>{
  names.push(b.dataset.name);byId(t+'Search').value='';renderTeam('enemy');renderTeam('ally');autoBuild();
 });
}
['enemy','ally'].forEach(t=>{byId(t+'Search').addEventListener('input',()=>renderTeam(t));renderTeam(t);});

// Prediction-only draft signals. They do not reveal actual enemy items.
// Core: one footwear + Enchanted Talisman + Concentrated Energy.
// Flex: 3 distinct items ranked against healing, HP, mobility, dive and expected defense.
function analyze(options={}){
 const en=selected.enemy,al=selected.ally;
 const enemyHeal=sum(en,'H'),enemySustain=sum(en,'S'),enemyVamp=sum(en,'L'),enemyShield=sum(en,'Q');
 const enemyTank=sum(en,'T'),enemyFront=sum(en,'F'),enemyDive=sum(en,'D'),enemyMob=sum(en,'M'),enemyBurst=sum(en,'B'),enemyCC=sum(en,'C'),enemyMagic=sum(en,'G'),enemyPoke=sum(en,'P'),enemyZone=sum(en,'Z');
 const allyPeel=sum(al,'R'),allyFront=sum(al,'F'),allyShield=sum(al,'Q'),allyHeal=sum(al,'H'),allyCC=sum(al,'C');
 // Named gameplay mechanics from each hero, supplemented by legacy trait estimates.
 const mech=n=>H.get(n).mechanics||{};
 const has=(n,key,term)=>((mech(n)[key]||[]).join(' ').toLowerCase().includes(term));
 const healSources=en.filter(n=>{const h=H.get(n),m=mech(n);return trait(h,'H')>0||(m.sustain||[]).length>0;}).length;
 const healingSignal=en.reduce((v,n)=>{const h=H.get(n),m=mech(n),st=(m.sustain||[]).join(' ').toLowerCase();return v+trait(h,'H')*1.5+trait(h,'S')*.38+trait(h,'L')*.55+(st.includes('regen')||st.includes('healing')?0.6:0)+(st.includes('spell vamp')||st.includes('lifesteal')?0.45:0);},0);
 const healNeed=healingSignal+Math.max(0,healSources-1)*.35;
 // Shield is tracked separately; it is not itself healing and should not force antiheal.
 const shieldNeed=enemyShield*.75+en.filter(n=>(mech(n).shield||[]).length>0).length*.25;
 const hardHeal=healNeed>=3.4&&(enemyHeal>=2||healSources>=2||enemySustain>=4||enemyVamp>=4);
 const tankNeed=enemyTank*.95+enemyFront*.35;
 const frontliners=en.filter(n=>{const h=H.get(n);return trait(h,'T')>=2||trait(h,'F')>=3}).length;
 // Expected resistance is a draft heuristic, not actual item inspection.
 const magicDefRisk=en.reduce((v,n)=>{const h=H.get(n);return v+Math.max(0,trait(h,'T')*.62+trait(h,'F')*.30-.7)},0);
 const penetrationNeed=magicDefRisk+Math.max(0,frontliners-1)*.35;
 const protection=allyPeel*.75+allyFront*.42+allyShield*.30+allyHeal*.25+allyCC*.12;
 const engagePressure=en.reduce((v,n)=>v+(has(n,'engage','mounted')?.6:0)+(has(n,'engage','soaring')?.6:0)+(has(n,'engage','global target')?.65:0),0);
 const diveNeed=Math.max(0,enemyDive*.8+enemyBurst*.42+enemyMob*.24+engagePressure-protection*.34);
 const slowNeed=Math.max(0,enemyMob*.68+enemyDive*.23+enemyZone*.12-allyPeel*.32-allyCC*.23);
 const hardControl=en.reduce((v,n)=>v+H.get(n).cc.filter(c=>['suppress','freeze','polymorph','stun','knockup','pull','immobilize','taunt','fear'].includes(c)).length*.3,0);
 const ccNeed=enemyCC*.55+hardControl;
 const hardPen=penetrationNeed>=3.5;
 const hardTank=tankNeed>=4.1;
 const hardDive=diveNeed>=5.2;
 const boots='shoes'; // Always Magic Boots (cooldown), no other boot candidates.
 const scores={
  glow:16+healNeed*11+shieldNeed*.8-(healNeed<3.4?22:0)+(hardHeal?12:0),
  lantern:25+tankNeed*10+(hardTank?13:0),
  divine:18+penetrationNeed*8+(hardPen?12:0),
  genius:39+(tankNeed<3?8:0),
  crystal:43+(allyCC>=5?3:0),
  ice:16+slowNeed*8+(slowNeed>=4?8:0),
  wings:14+diveNeed*3+enemyPoke*1.7,
  lightning:23+(enemyFront<4?4:0),
  winter:5+diveNeed*8+(hardDive?18:0),
  clock:7+diveNeed*2,
  fleeting:9,
  sky:-30
 };
 // Reserve room for a true damage multiplier, especially against low-heal/low-tank drafts.
 const damageCore=['genius','crystal','divine','lantern'];
 let flex=Object.keys(scores).sort((a,b)=>scores[b]-scores[a]||a.localeCompare(b)).slice(0,3);
 if(!flex.some(id=>damageCore.includes(id))){
  const upgrade=damageCore.sort((a,b)=>scores[b]-scores[a])[0];
  flex[flex.length-1]=upgrade;
 }
 const rank=(a,b)=>scores[b]-scores[a]||a.localeCompare(b);
 // Slot 4: direct counter if necessary, otherwise a strong damage item.
 const counters=flex.filter(id=>(id==='glow'&&hardHeal)||(id==='lantern'&&hardTank)||(id==='divine'&&hardPen));
 let orderFlex;
 if(options.damageFirst){
  // Refresh: same items, alternate purchase priority, not a new build.
  orderFlex=[...flex].sort((a,b)=>(damageCore.includes(b)?1:0)-(damageCore.includes(a)?1:0)||rank(a,b));
 }else{
  orderFlex=[...flex].sort((a,b)=>(counters.includes(b)?1:0)-(counters.includes(a)?1:0)||rank(a,b));
 }
 const order=[boots,'talisman','energy',...orderFlex];
 const cdItem=order.reduce((v,id)=>v+I[id].cd,0);
 const cdr=Math.min(45,cdItem+10); // Existing emblem CDR assumption preserved.
 return {order,cd:cdr,rawCD:cdItem+10,scores,signals:{healNeed,tankNeed,penetrationNeed,diveNeed,slowNeed,protection,healSources,hardHeal,hardPen,hardTank},boots};
}
function strength(v){return v>=6?'tinggi':v>=2.8?'sedang':'rendah';}
function noteFor(id,a){
 const s=a.signals;
 const map={
  shoes:'Cooldown awal untuk farming dan rotasi skill lebih cepat.',
  arcane:'Penetrasi awal untuk damage terhadap target relatif tipis.',
  tough:'Lebih aman melawan magic damage dan CC berat.',
  talisman:'CORE: mana dan cooldown untuk siklus skill selama farming/war.',
  energy:'CORE: spell vamp untuk bertahan saat spam skill dan duel jarak menengah.',
  glow:`Prediksi kebutuhan antiheal/regen (${strength(s.healNeed)}).`,
  lantern:`Banyak HP/frontline tebal (${strength(s.tankNeed)}): proc lewat hit skill berulang.`,
  divine:'Prediksi kebutuhan penetration dari frontline, bukan pembacaan equipment.',
  genius:'Skill berulang membantu menekan magic defense lawan.',
  crystal:'Magic power besar untuk scaling damage skill.',
  ice:`Slow tambahan untuk target lincah (${strength(s.slowNeed)}).`,
  wings:'Shield dan speed ekstra saat dive/poke berat.',
  lightning:'Tambahan burst dari siklus spam skill.',
  winter:`Opsi aktif saat musuh bisa dive/burst (${strength(s.diveNeed)}); ketuk kartu untuk alternatif damage.`,
  clock:'Pertahanan situasional; tidak mengalahkan core farming.',
  fleeting:'Pengurangan cooldown ultimate situasional.',
  sky:'Execute situasional, bukan prioritas utama Cyclops.'
 };
 return map[id]||I[id].why;
}
function tags(a){const s=a.signals,t=[];
 if(s.hardHeal)t.push('Antiheal');
 if(s.hardTank)t.push('Anti-HP');
 if(s.hardPen)t.push('Magic Pen');
 if(s.diveNeed>=4.3)t.push('Anti-dive');
 if(s.slowNeed>=3.5)t.push('Anti-lincah');
 if(!t.length)t.push('Damage / sustain');
 return t.slice(0,3);
}
let latest='',refreshCounter=false,winterSelected=false;
function build(scroll=true){
 const a=analyze({damageFirst:refreshCounter});
 const winterIndex=a.order.indexOf('winter');
 // Winter Crown, when picked by the engine, can be toggled to the best unselected damage alternative.
 const damageAlternatives=['crystal','genius','divine','lantern','lightning','glow','ice','wings'];
 const winterAlternative=winterIndex<0?null:damageAlternatives.filter(id=>!a.order.includes(id)).sort((x,y)=>a.scores[y]-a.scores[x])[0]||null;
 if(winterAlternative&&!winterSelected){a.order[winterIndex]=winterAlternative;}
 const cdItem=a.order.reduce((v,id)=>v+I[id].cd,0);a.rawCD=cdItem+10;a.cd=Math.min(45,a.rawCD);
 const why=a.order.map((id,i)=>`<div class="why"><b>${i+1}. ${esc(I[id].name)}</b><span>${esc(noteFor(id,a))}</span></div>`).join('');
 const enemyProfiles=selected.enemy.map(profileChip).join('');
 const allyProfiles=selected.ally.map(profileChip).join('');
 const descMode=refreshCounter?'Refresh: item damage diprioritaskan sebelum counter lain, dengan 3 item inti tetap.':'Standar: counter penting didahulukan pada 3 slot fleksibel.';
 byId('result').innerHTML=`<div class="row-title"><b>Build Cyclops Jungle</b><span style="display:flex;gap:8px;align-items:center"><button id="refresh" class="linkbtn" type="button">⟳ Refresh urutan</button><button id="copy" class="linkbtn" type="button">Salin ↗</button></span></div><div class="chips"><span class="pill">${a.cd}% CDR estimasi</span>${tags(a).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div><div class="itemgrid">${a.order.map((id,i)=>`<div class="item ${id==='talisman'||id==='energy'?'must':''}"><span class="num">${i+1}</span>${face(I[id].imgs,I[id].name)}<b>${esc(I[id].name)}</b><small>${esc(I[id].desc)}</small></div>`).join('')}</div><div class="micro"><b>Emblem statis:</b> Mage · Inspire / Festival of Blood / Impure Rage<br><b>Spell:</b> Retribution (Jungle)</div><details><summary>Kenapa pilih item ini?</summary>${why}</details><details><summary>Analisis hero (${selected.enemy.length} musuh + ${selected.ally.length} teman)</summary><div class="tiny-head">Musuh</div>${enemyProfiles||'<div class="tip">Belum dipilih.</div>'}<div class="tiny-head">Teman</div>${allyProfiles||'<div class="tip">Belum dipilih.</div>'}<div class="tip">Semua skor hanya prediksi draft, bukan equipment nyata lawan.</div></details><div class="tip">${descMode} Winter Crown dapat diganti lewat kartu bertitik biru jika direkomendasikan. Retribution dan emblem tidak berubah.</div>`;
 if(winterAlternative){
  const card=byId('result').querySelectorAll('.item')[winterIndex];
  const shown=winterSelected?'Winter Crown':I[winterAlternative].name;
  const next=winterSelected?I[winterAlternative].name:'Winter Crown';
  const dot=document.createElement('span');dot.setAttribute('aria-hidden','true');dot.style.cssText='position:absolute;top:5px;right:5px;width:12px;height:12px;border-radius:50%;background:#42a5ff;border:2px solid #d7edff;box-shadow:0 0 0 1px #174987;pointer-events:none;';
  card.appendChild(dot);card.style.cursor='pointer';card.setAttribute('role','button');card.setAttribute('tabindex','0');card.setAttribute('title',`Ganti ${shown} ke ${next}`);card.setAttribute('aria-label',`Ganti ${shown} ke ${next}`);
  const toggle=()=>{winterSelected=!winterSelected;build(false);};
  card.onclick=toggle;card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}};
 }
 latest=`Cyclops Jungle vs ${selected.enemy.join(', ')||'(belum dipilih)'}\nTim: ${selected.ally.join(', ')||'(belum dipilih)'}\n${a.order.map((id,i)=>`${i+1}. ${I[id].name}`).join('\n')}\nEmblem: Mage / Inspire / Festival of Blood / Impure Rage\nSpell: Retribution`;
 byId('copy').onclick=async()=>{
  try{await navigator.clipboard.writeText(latest);}catch(e){const t=document.createElement('textarea');t.value=latest;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();}
  byId('copy').textContent='Disalin ✓';
 };
 byId('refresh').onclick=()=>{refreshCounter=!refreshCounter;build(false);};
 if(scroll)byId('result').scrollIntoView({behavior:'smooth',block:'start'});
 return a;
}
function profileChip(name){
 const h=H.get(name);return `<div class="heroline"><b>${esc(h.name)} <small>${esc(h.tier)}${h.proMeta?' · Pro':''}</small></b><span>${esc(h.kit)}</span><small>CC: ${esc(h.cc.join(', ')||'tidak dominan')} · ${esc(h.role)}${h.patchChange?' · Updated '+esc(h.patchChange):''}</small></div>`;
}
function autoBuild(){
 refreshCounter=false;winterSelected=false;
 if(!selected.enemy.length&&!selected.ally.length){latest='';byId('result').innerHTML='<div class="empty">Pilih hero musuh atau teman untuk build Cyclops Jungle.</div>';return;}
 build(false);
}
(function boot(){
 const valid=DATA.heroes.length===133&&Object.keys(I).length===17&&DATA.heroes.every(h=>h.kit&&h.role&&h.cc&&h.traits&&h.mechanics);
 if(!valid){byId('bootMsg').textContent='Data tidak lengkap. Periksa file HTML.';byId('skip').style.display='block';byId('skip').onclick=()=>document.body.classList.add('ready');return;}
 byId('progress').style.width='100%';byId('bootCount').textContent='133 hero · 17 item siap';byId('bootMsg').textContent='Data siap. Gambar dimuat saat diperlukan.';
 document.body.classList.add('ready');
})();
